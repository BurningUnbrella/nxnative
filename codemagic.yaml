
workflows:
  nxnative-iphone:
    name: NXNative - Build unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 27.1
      groups:
        - nxnative_secrets

    scripts:
      - name: Check environment and download dependencies
        script: |
          set -euo pipefail
          xcodebuild -version
          uname -m
          command -v brew

          xcodebuild -downloadComponent MetalToolchain

          brew install xcodegen zstd glslang

          if ! command -v dotnet >/dev/null 2>&1; then
            brew install --cask dotnet-sdk
          fi

          python3 -m venv "$CM_BUILD_DIR/.build-venv"
          source "$CM_BUILD_DIR/.build-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools nsz gdown \
            'backports.zstd; python_version < "3.14"'

      - name: Download game from Google Drive
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          mkdir -p \
            "$CM_BUILD_DIR/private/game" \
            "$CM_BUILD_DIR/private/keys"

          umask 077

          echo "Downloading your game from Google Drive..."

          python -m gdown \
            "https://drive.google.com/file/d/1w9-Q_z3C21paYf5ijQHgYoFrA4J3QahO/view" \
            -O "$CM_BUILD_DIR/private/game.zip" \
            --fuzzy

          echo "Validating game archive..."

          python - <<'PY'
          import os
          import pathlib
          import stat
          import zipfile

          root = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "private" / "game"
          archive = root.parent / "game.zip"

          if not zipfile.is_zipfile(archive):
              raise RuntimeError(
                  "Download is not a valid ZIP. "
                  "Check Google Drive permissions and download limits."
              )

          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  name = entry.filename.replace("\\", "/")
                  p = pathlib.PurePosixPath(name)

                  if p.is_absolute() or ".." in p.parts or not p.parts:
                      raise RuntimeError("Unsafe archive path")

                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise RuntimeError("Symlinks not allowed")

              z.extractall(root)

          matches = [
              p for p in root.rglob("*")
              if p.is_file() and p.suffix.lower()
              in (".nsp", ".xci", ".nsz", ".xcz")
          ]

          if not matches:
              raise RuntimeError(
                  "Archive contains no NSP/XCI/NSZ/XCZ files"
              )

          print(f"Found {len(matches)} game file(s).")
          PY

          rm -f "$CM_BUILD_DIR/private/game.zip"

      - name: Load private keys
        script: |
          set -euo pipefail

          : "${PROD_KEYS_B64:?Set PROD_KEYS_B64 in nxnative_secrets}"

          umask 077

          printf '%s' "$PROD_KEYS_B64" | \
            base64 --decode \
            > "$CM_BUILD_DIR/private/keys/prod.keys" || \
          printf '%s' "$PROD_KEYS_B64" | \
            base64 -D \
            > "$CM_BUILD_DIR/private/keys/prod.keys"

          test -s "$CM_BUILD_DIR/private/keys/prod.keys"

      - name: Build IPA with nxnative
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          mkdir -p "$CM_BUILD_DIR/artifacts"

          python scripts/build_ipa_from_nsp.py \
            "$CM_BUILD_DIR/private/game" \
            -k "$CM_BUILD_DIR/private/keys/prod.keys" \
            -o "$CM_BUILD_DIR/artifacts/game.ipa"

          test -s "$CM_BUILD_DIR/artifacts/game.ipa"

          rm -rf "$CM_BUILD_DIR/private"

    artifacts:
      - artifacts/*.ipa
