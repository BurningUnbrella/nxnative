
workflows:
  nxnative-iphone:
    name: NXNative - Build unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 27.1
      groups:
        - nxnative_secrets

    scripts:
      - name: Install build dependencies
        script: |
          set -euo pipefail

          echo "Checking Xcode..."
          xcodebuild -version
          uname -m

          echo "Installing Metal Toolchain..."
          xcodebuild -downloadComponent MetalToolchain

          echo "Installing dependencies..."
          brew install xcodegen zstd glslang

          if ! command -v dotnet >/dev/null 2>&1; then
            brew install --cask dotnet-sdk
          fi

          echo "Setting up Python..."
          python3 -m venv "$CM_BUILD_DIR/.build-venv"
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools nsz gdown \
            'backports.zstd; python_version < "3.14"'

      - name: Download and extract game
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          mkdir -p \
            "$CM_BUILD_DIR/private/game" \
            "$CM_BUILD_DIR/private/keys"

          umask 077

          echo "Downloading game from Google Drive..."

          python -m gdown \
            "1vI6OtlxgB5uxh6R-1ruPefMUOUEXF-Pw" \
            -O "$CM_BUILD_DIR/private/game.zip" \
            --continue \
            --retries 5

          echo "Validating and extracting ZIP..."

          python - <<'PY'
          import os
          import pathlib
          import stat
          import zipfile

          root = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "private" / "game"
          archive = root.parent / "game.zip"

          if not zipfile.is_zipfile(archive):
              raise RuntimeError("Google Drive did not return a valid ZIP")

          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(
                      entry.filename.replace("\\", "/")
                  )
                  mode = entry.external_attr >> 16

                  if (
                      p.is_absolute()
                      or ".." in p.parts
                      or stat.S_ISLNK(mode)
                  ):
                      raise RuntimeError("Unsafe ZIP entry")

              z.extractall(root)

          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          games = [
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix.lower() in extensions
              and not p.name.startswith("._")
          ]

          if not games:
              raise RuntimeError("No Switch game files found")

          game_dirs = {p.parent for p in games}

          if len(game_dirs) != 1:
              raise RuntimeError(
                  "Game files must be in one folder. "
                  f"Found {len(game_dirs)} folders."
              )

          game_dir = next(iter(game_dirs))

          print("Game directory:", game_dir)
          for game in games:
              print("Found:", game.name)

          # Save the detected directory for the build step.
          env_file = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "game_path.env"
          env_file.write_text(f"GAME_DIR={game_dir}\n")
          PY

          rm -f "$CM_BUILD_DIR/private/game.zip"

      - name: Load Nintendo Switch keys
        script: |
          set -euo pipefail

          : "${PROD_KEYS_B64:?Missing PROD_KEYS_B64}"

          mkdir -p "$CM_BUILD_DIR/private/keys"
          umask 077

          printf '%s' "$PROD_KEYS_B64" | \
            base64 -D \
            > "$CM_BUILD_DIR/private/keys/prod.keys"

          test -s "$CM_BUILD_DIR/private/keys/prod.keys"

          echo "Keys loaded successfully."

      - name: Build IPA with nxnative
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          source "$CM_BUILD_DIR/game_path.env"

          mkdir -p "$CM_BUILD_DIR/artifacts"

          echo "Building game from: $GAME_DIR"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$CM_BUILD_DIR/private/keys/prod.keys" \
            -o "$CM_BUILD_DIR/artifacts/game.ipa" \
            --platform ios

          test -s "$CM_BUILD_DIR/artifacts/game.ipa"

          echo "IPA created successfully!"

          rm -rf "$CM_BUILD_DIR/private"

    artifacts:
      - artifacts/*.ipa
