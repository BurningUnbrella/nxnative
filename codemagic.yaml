
workflows:
  nxnative-iphone:
    name: NXNative - Build unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 27.1
      groups:
        - nxnative_secrets

    scripts:
      - name: Install build dependencies
        script: |
          set -euo pipefail

          echo "Checking Xcode..."
          xcodebuild -version
          uname -m

          echo "Installing Metal Toolchain..."
          xcodebuild -downloadComponent MetalToolchain

          echo "Installing dependencies..."
          brew install xcodegen zstd glslang

          if ! command -v dotnet >/dev/null 2>&1; then
            brew install --cask dotnet-sdk
          fi

          echo "Setting up Python..."
          python3 -m venv "$CM_BUILD_DIR/.build-venv"
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install \
            lz4 \
            capstone \
            fonttools \
            nsz \
            gdown \
            'backports.zstd; python_version < "3.14"'

      - name: Download game from Google Drive
        script: |
          set -euo pipefail

          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          mkdir -p \
            "$CM_BUILD_DIR/private/game" \
            "$CM_BUILD_DIR/private/keys"

          umask 077

          echo "Downloading your game from Google Drive..."

          python -m gdown \
            "1w9-Q_z3C21paYf5ijQHgYoFrA4J3QahO" \
            -O "$CM_BUILD_DIR/private/game.zip" \
            --continue \
            --retries 5

          echo "Validating game archive..."

          python - <<'PY'
          import os
          import pathlib
          import stat
          import zipfile

          root = (
              pathlib.Path(os.environ["CM_BUILD_DIR"])
              / "private"
              / "game"
          )

          archive = root.parent / "game.zip"

          if not zipfile.is_zipfile(archive):
              raise RuntimeError(
                  "Google Drive download is not a valid ZIP. "
                  "Check sharing permissions or download limits."
              )

          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  name = entry.filename.replace("\\", "/")
                  p = pathlib.PurePosixPath(name)

                  if (
                      p.is_absolute()
                      or ".." in p.parts
                      or not p.parts
                  ):
                      raise RuntimeError("Unsafe ZIP path")

                  mode = entry.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise RuntimeError(
                          "ZIP contains a symbolic link"
                      )

              print("Extracting game files...")
              z.extractall(root)

          matches = [
              p for p in root.rglob("*")
              if p.is_file()
              and p.suffix.lower()
              in (".nsp", ".xci", ".nsz", ".xcz")
          ]

          if not matches:
              raise RuntimeError(
                  "No NSP/XCI/NSZ/XCZ game files found"
              )

          print(f"Found {len(matches)} game file(s).")
          PY

          rm -f "$CM_BUILD_DIR/private/game.zip"

      - name: Load private Nintendo Switch keys
        script: |
          set -euo pipefail

          : "${PROD_KEYS_B64:?Missing PROD_KEYS_B64}"

          mkdir -p "$CM_BUILD_DIR/private/keys"
          umask 077

          printf '%s' "$PROD_KEYS_B64" | \
            base64 -D \
            > "$CM_BUILD_DIR/private/keys/prod.keys"

          test -s "$CM_BUILD_DIR/private/keys/prod.keys"

          echo "Keys file prepared successfully."

      - name: Build IPA with nxnative
        script: |
          set -euo pipefail

          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          mkdir -p "$CM_BUILD_DIR/artifacts"

          echo "Starting nxnative build..."

          python scripts/build_ipa_from_nsp.py \
            "$CM_BUILD_DIR/private/game" \
            -k "$CM_BUILD_DIR/private/keys/prod.keys" \
            -o "$CM_BUILD_DIR/artifacts/game.ipa" \
            --platform ios

          echo "Checking IPA..."

          test -s "$CM_BUILD_DIR/artifacts/game.ipa"

          echo "IPA created successfully!"

    artifacts:
      - artifacts/*.ipa
