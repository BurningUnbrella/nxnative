
workflows:
  nxnative-iphone:
    name: NXNative - Build unsigned iPhone IPA
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 27.1
      groups:
        - nxnative_secrets

    scripts:
      - name: Install build dependencies
        script: |
          set -euo pipefail

          echo "Checking Xcode..."
          xcodebuild -version
          uname -m

          echo "Installing Metal Toolchain..."
          xcodebuild -downloadComponent MetalToolchain

          echo "Installing dependencies..."
          brew install xcodegen zstd glslang

          if ! command -v dotnet >/dev/null 2>&1; then
            brew install --cask dotnet-sdk
          fi

          echo "Setting up Python..."
          python3 -m venv "$CM_BUILD_DIR/.build-venv"
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install \
            lz4 \
            capstone \
            fonttools \
            nsz \
            gdown \
            'backports.zstd; python_version < "3.14"'

      - name: Download and prepare game files
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          mkdir -p \
            "$CM_BUILD_DIR/private/game" \
            "$CM_BUILD_DIR/private/keys"

          umask 077

          echo "Downloading game from Google Drive..."

          python -m gdown \
            "1w9-Q_z3C21paYf5ijQHgYoFrA4J3QahO" \
            -O "$CM_BUILD_DIR/private/game.zip" \
            --continue \
            --retries 5

          echo "Validating and extracting ZIP..."

          python - <<'PY'
          import os
          import pathlib
          import shutil
          import stat
          import zipfile

          root = pathlib.Path(os.environ["CM_BUILD_DIR"]) / "private" / "game"
          archive = root.parent / "game.zip"
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          if not zipfile.is_zipfile(archive):
              raise RuntimeError("Google Drive did not return a valid ZIP")

          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  p = pathlib.PurePosixPath(entry.filename.replace("\\", "/"))
                  mode = entry.external_attr >> 16

                  if p.is_absolute() or ".." in p.parts:
                      raise RuntimeError("Unsafe ZIP path")

                  if stat.S_ISLNK(mode):
                      raise RuntimeError("ZIP contains symlinks")

              z.extractall(root)

          print("Searching for Switch game files...")

          games = [
              p for p in root.rglob("*")
              if p.is_file() and p.suffix.lower() in extensions
              and not p.name.startswith("._")
          ]

          if not games:
              raise RuntimeError("No NSP/XCI/NSZ/XCZ files found")

          for game in games:
              print(
                  f"Found: {game.relative_to(root)} "
                  f"({game.stat().st_size:,} bytes)"
              )

              if game.parent != root:
                  destination = root / game.name

                  if destination.exists():
                      raise RuntimeError(
                          f"Duplicate filename: {game.name}"
                      )

                  shutil.move(str(game), str(destination))

          print("Checking package headers...")

          valid = []

          for game in root.iterdir():
              if game.suffix.lower() not in extensions:
                  continue

              with game.open("rb") as f:
                  header = f.read(0x104)

              if header[:4] == b"PFS0" or header[0x100:0x104] == b"HEAD":
                  valid.append(game.name)
                  print(f"Valid package header: {game.name}")
              else:
                  print(f"Unrecognized package header: {game.name}")

          if not valid:
              raise RuntimeError(
                  "No recognized NSP/XCI packages. "
                  "Check the extracted files."
              )

          print(f"Ready: {len(valid)} package(s)")
          PY

          rm -f "$CM_BUILD_DIR/private/game.zip"

      - name: Load private Nintendo Switch keys
        script: |
          set -euo pipefail

          : "${PROD_KEYS_B64:?Missing PROD_KEYS_B64}"

          mkdir -p "$CM_BUILD_DIR/private/keys"
          umask 077

          printf '%s' "$PROD_KEYS_B64" | \
            base64 -D \
            > "$CM_BUILD_DIR/private/keys/prod.keys"

          test -s "$CM_BUILD_DIR/private/keys/prod.keys"

          echo "Keys prepared successfully."

      - name: Build IPA with nxnative
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.build-venv/bin/activate"

          mkdir -p "$CM_BUILD_DIR/artifacts"

          echo "Game files ready:"
          find "$CM_BUILD_DIR/private/game" \
            -maxdepth 1 -type f \
            \( -iname '*.nsp' -o -iname '*.xci' \
               -o -iname '*.nsz' -o -iname '*.xcz' \) \
            -print

          echo "Starting nxnative build..."

          python scripts/build_ipa_from_nsp.py \
            "$CM_BUILD_DIR/private/game" \
            -k "$CM_BUILD_DIR/private/keys/prod.keys" \
            -o "$CM_BUILD_DIR/artifacts/game.ipa" \
            --platform ios

          echo "Checking IPA..."
          test -s "$CM_BUILD_DIR/artifacts/game.ipa"

          echo "IPA created successfully!"

          rm -rf "$CM_BUILD_DIR/private"

    artifacts:
      - artifacts/*.ipa
